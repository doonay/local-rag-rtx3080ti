name: local-rag

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [rag-network]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DOCUMENT_PROCESSOR_URL: http://document_processor:8080
      EMBEDDER_URL: http://embedder:8080
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      RERANKER_URL: http://reranker:8080
      VLLM_URL: http://vllm:8000
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      TMPDIR: /tmp
    volumes:
      - ./.local/docker/tmp/api:/tmp
    depends_on:
      document_processor:
        condition: service_healthy
      embedder:
        condition: service_healthy
      qdrant:
        condition: service_started
      reranker:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [rag-network]

  document_processor:
    build:
      context: .
      dockerfile: document_processor/Dockerfile
    environment:
      MAX_DOCUMENT_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      TMPDIR: /tmp
    volumes:
      - ./.local/docker/tmp/document-processor:/tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [rag-network]

  embedder:
    build:
      context: .
      dockerfile: embedder_service/Dockerfile
    environment:
      RAG_PROJECT_LOCAL_ROOT: /root/.cache/local-rag
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: cpu
      EMBEDDING_DIMENSION: "1024"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_LENGTH: ${EMBEDDING_MAX_LENGTH:-1024}
      OMP_NUM_THREADS: ${EMBEDDING_CPU_THREADS:-8}
    ports:
      - "127.0.0.1:${EMBEDDER_PORT:-8080}:8080"
    volumes:
      - ./.local/docker/cache:/root/.cache
      - ./.local/docker/tmp/embedder:/tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    restart: unless-stopped
    networks: [rag-network]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./.local/docker/qdrant:/qdrant/storage
    restart: unless-stopped
    networks: [rag-network]

  reranker:
    build:
      context: .
      dockerfile: reranker_service/Dockerfile
    environment:
      RAG_PROJECT_LOCAL_ROOT: /root/.cache/local-rag
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      RERANKER_USE_FP16: "true"
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-4}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-2048}
      CUDA_VISIBLE_DEVICES: "0"
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8081}:8080"
    volumes:
      - ./.local/docker/cache:/root/.cache
      - ./.local/docker/tmp/reranker:/tmp
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    restart: unless-stopped
    networks: [rag-network]

  vllm:
    image: vllm/vllm-openai:v0.27.1
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/local-rag/cache/huggingface
      HF_HUB_CACHE: /root/.cache/local-rag/cache/huggingface/hub
      HF_XET_CACHE: /root/.cache/local-rag/cache/huggingface/xet
      TORCH_HOME: /root/.cache/local-rag/cache/torch
      XDG_CACHE_HOME: /root/.cache/local-rag/cache
      TRITON_CACHE_DIR: /root/.cache/local-rag/cache/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/local-rag/cache/torchinductor
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    command:
      - ${LLM_MODEL:-Qwen/Qwen3-8B-AWQ}
      - --quantization
      - awq
      - --dtype
      - half
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-2}
      - --enable-prefix-caching
      - --generation-config
      - vllm
    volumes:
      - ./.local/docker/cache:/root/.cache
      - ./.local/docker/tmp/vllm:/tmp
    ipc: host
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m
    restart: unless-stopped
    networks: [rag-network]

networks:
  rag-network:
    driver: bridge
