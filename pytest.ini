[pytest]
testpaths = document_processor/tests common/tests embedder_service/tests reranker_service/tests local_app/tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast tests without external services
    integration: tests that require running service containers
    e2e: tests that require the complete stack
    asyncio: asynchronous tests
addopts =
    --strict-markers
    --tb=short
    -m "not integration and not e2e"
filterwarnings =
    ignore::DeprecationWarning
